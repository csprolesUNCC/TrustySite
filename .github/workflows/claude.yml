name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only Luke and Carson can start @claude, so nobody else can use the Claude subscription or give it
    # orders. (The action also refuses anyone without write access; this makes it explicit.)
    if: |
      contains(fromJSON('["LukeHorne", "csprolesUNCC"]'), github.actor) && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Pinned to one release so @claude doesn't change between runs. Dependabot (.github/dependabot.yml)
      # opens a PR when there's a newer one.
      - uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # @claude only sees comments from Luke, Carson and itself, not from anyone else on the thread.
          include_comments_by_actor: LukeHorne,csprolesUNCC,claude[bot]
          # Pushes go through the action's own git-push.sh, which it always allows. Don't add a plain
          # Bash(git push:*): its flags can run any command on the runner. No node either: the repo is
          # public, so anyone can write the issue text @claude reads.
          claude_args: |
            --model opus
            --effort max
            --allowedTools "Bash(git add:*),Bash(git commit:*),Bash(git checkout:*),Bash(git status:*),Bash(git diff:*),Bash(git merge --ff-only:*)"
            --append-system-prompt "Only when the person who mentioned you explicitly asks you to push to main: finish and push your branch as usual, then run git checkout main, then git merge --ff-only with your branch, then push main with the same push script you use for your branch (origin main). If any of those steps fail, for example because main moved while you worked, stop there, give the Create PR link instead and say why. Without that request, keep using your branch and the PR link."
