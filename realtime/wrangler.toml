# Trusty's online rooms (see worker.js): Trusty Fever's rooms and Trusty Blackjack's and Trusty Craps' tables. Deploy from this
# folder with `npm install`, then `npm run deploy`; the secret goes in with `npx wrangler secret put FEVER_SECRET`
# (the same value as FEVER_SECRET on Vercel).
name = "trusty-fever"
main = "worker.js"
compatibility_date = "2026-10-20"

# Where the click bank is (utils/bank.js, ?action=bank on the site). `npm run dev` points it at the dev server.
[vars]
SITE_URL = "https://trustydahorse.com"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "FeverRoom"

[[durable_objects.bindings]]
name = "TABLES"
class_name = "BlackjackTable"

[[durable_objects.bindings]]
name = "CRAPS"
class_name = "CrapsTable"

# SQLite-backed Durable Objects are the kind the Workers Free plan allows. Each new class needs a new tag.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["FeverRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BlackjackTable"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CrapsTable"]

[dev]
port = 8790
