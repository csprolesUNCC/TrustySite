<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>3D Trusty — Trusty da Horse</title>
    <meta name="description" content="Spin, zoom and inspect a 3D model of Trusty da Horse, or place him in your room with AR.">
    <link rel="canonical" href="https://trustydahorse.com/pages/viewer.html">
    <meta name="theme-color" content="#fbf8f0">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Trusty da Horse">
    <meta property="og:title" content="Trusty in 3 Dimensions!">
    <meta property="og:description" content="A 3D model of Trusty Da Horse for your viewing pleasure.">
    <meta property="og:image" content="https://trustydahorse.com/images/trusty/3dSample.jpg">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/icons/mobile-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/icons/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/icons/icon-16x16.png">
    <link rel="preload" href="/fonts/permanent-marker-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/caveat-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/styles/stylesheet.css">
    <script type="module" src="/scripts/site.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <script> window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); }; </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <trusty-header></trusty-header>

    <main id="main">
        <header class="page-head container">
            <p class="eyebrow">3D Viewer</p>
            <h1>Trusty in 3 Dimensions!</h1>
            <p class="lead">This is a 3D model of Trusty Da Horse for your viewing pleasure.</p>
        </header>

        <section class="section-tight container" aria-label="3D model">
            <div class="viewer-stage">
                <model-viewer
                    id="viewer"
                    src="/models/horse_glb.glb"
                    alt="Trusty's 3D Model of World Domination"
                    poster="/images/trusty/3dSample.webp"
                    shadow-intensity="1.5"
                    exposure="1.2"
                    camera-controls
                    touch-action="pan-y"
                    auto-rotate
                    ar
                    loading="eager">
                    <button slot="ar-button" class="btn btn-highlight btn-sm viewer-ar" type="button">View in your room</button>
                </model-viewer>
                <p class="viewer-hint hand" aria-hidden="true">drag me around!</p>
                <div class="viewer-toolbar">
                    <button class="btn btn-outline btn-sm" type="button" id="toggle-spin" aria-pressed="true">Pause spin</button>
                    <button class="btn btn-outline btn-sm" type="button" id="reset-view">Reset view</button>
                </div>
            </div>
            <p class="viewer-credit">Drag to rotate, scroll or pinch to zoom. Model: &ldquo;Stylized lowpoly HORSE&rdquo; by LucySail.</p>
        </section>
    </main>

    <trusty-footer></trusty-footer>

    <script type="module">
        const viewer = document.getElementById('viewer');
        const spin = document.getElementById('toggle-spin');

        function setSpin(on) {
            viewer.autoRotate = on;
            spin.setAttribute('aria-pressed', String(on));
            spin.textContent = on ? 'Pause spin' : 'Resume spin';
        }
        spin.addEventListener('click', () => setSpin(!viewer.autoRotate));
        // Viewers who've asked their device for less motion start with him standing still.
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) setSpin(false);

        document.getElementById('reset-view').addEventListener('click', () => {
            viewer.cameraOrbit = 'auto auto auto';
            viewer.cameraTarget = 'auto auto auto';
            viewer.fieldOfView = 'auto';
            viewer.resetTurntableRotation?.();
        });
    </script>
</body>
</html>
