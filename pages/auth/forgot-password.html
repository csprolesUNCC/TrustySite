<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Reset your password — Trusty da Horse</title>
    <meta name="description" content="Get a link to reset your Trusty da Horse password.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#fbf8f0">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/icons/mobile-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/icons/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/icons/icon-16x16.png">
    <link rel="preload" href="/fonts/permanent-marker-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/caveat-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/styles/stylesheet.css">
    <script type="module" src="/scripts/site.js"></script>
    <script type="module" src="/scripts/auth.js"></script>
    <script> window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); }; </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <trusty-header></trusty-header>

    <main id="main" class="container auth-wrap">
        <div class="sheet auth-card">
            <img class="auth-face ink" src="/images/icons/mobile-icon.png" alt="" width="56" height="56">
            <p class="eyebrow">Forgot your password?</p>
            <h1>Reset password</h1>
            <p class="lead">Enter your email address and we'll send you a link to set a new one.</p>

            <form id="forgot-form">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
                <button class="btn btn-lg btn-block" type="submit">Send reset link</button>
            </form>

            <p class="auth-alt"><a href="/pages/auth/login.html">Back to login</a></p>
        </div>
    </main>

    <trusty-footer></trusty-footer>
</body>
</html>
