<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Create an account — Trusty da Horse</title>
    <meta name="description" content="Create a free Trusty da Horse account to get your name on the leaderboards.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#fbf8f0">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/mobile-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/icon-16x16.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Permanent+Marker&display=swap">
    <link rel="stylesheet" href="/styles/stylesheet.css">
    <script type="module" src="/scripts/site.js"></script>
    <script type="module" src="/scripts/auth.js"></script>
    <script> window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); }; </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <trusty-header></trusty-header>

    <main id="main" class="container auth-wrap">
        <div class="sheet auth-card">
            <img class="auth-face ink" src="/images/mobile-icon.png" alt="" width="56" height="56">
            <p class="eyebrow">Join the herd</p>
            <h1>Create an account</h1>
            <p class="lead">It's free. Your high scores save automatically and you can start clicking Trusty.</p>

            <form id="register-form">
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required spellcheck="false">
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" name="password" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" aria-pressed="false" aria-controls="password">Show</button>
                    </div>
                </div>
                <div class="field">
                    <label for="confirm-password">Confirm password</label>
                    <div class="password-wrap">
                        <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" aria-pressed="false" aria-controls="confirm-password">Show</button>
                    </div>
                </div>
                <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
                <button class="btn btn-lg btn-block" type="submit">Create account</button>
            </form>

            <p class="auth-alt">Already have an account? <a href="/pages/auth/login.html" data-keep-next>Log in here!</a></p>
        </div>
    </main>

    <trusty-footer></trusty-footer>
</body>
</html>
