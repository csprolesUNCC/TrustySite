<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Set a new password — Trusty da Horse</title>
    <meta name="description" content="Set a new password for your Trusty da Horse account.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#fbf8f0">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/mobile-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/icon-16x16.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Permanent+Marker&display=swap">
    <link rel="stylesheet" href="/styles/stylesheet.css">
    <script type="module" src="/scripts/site.js"></script>
    <script type="module" src="/scripts/auth.js"></script>
    <script> window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); }; </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <trusty-header></trusty-header>

    <main id="main" class="container auth-wrap">
        <div class="sheet auth-card">
            <img class="auth-face ink" src="/images/mobile-icon.png" alt="" width="56" height="56">
            <p class="eyebrow">Almost there</p>
            <h1>Set new password</h1>

            <div id="reset-missing" hidden>
                <p class="lead">This reset link is missing its token. It may have been copied incompletely.</p>
                <a class="btn btn-lg btn-block" href="/pages/auth/forgot-password.html">Request a new link</a>
            </div>

            <form id="reset-form">
                <p class="lead">Choose a new password for your account.</p>
                <div class="field">
                    <label for="password">New password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" name="password" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" aria-pressed="false" aria-controls="password">Show</button>
                    </div>
                </div>
                <div class="field">
                    <label for="confirm-password">Confirm new password</label>
                    <div class="password-wrap">
                        <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" aria-pressed="false" aria-controls="confirm-password">Show</button>
                    </div>
                </div>
                <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
                <button class="btn btn-lg btn-block" type="submit">Update password</button>
            </form>

            <p class="auth-alt"><a href="/pages/auth/login.html">Back to login</a></p>
        </div>
    </main>

    <trusty-footer></trusty-footer>
</body>
</html>
