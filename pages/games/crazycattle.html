<!DOCTYPE html>
<html lang="en" class="game-page">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Trusty's Crazy Cattle 3D! — Trusty da Horse</title>
    <meta name="description" content="Fight to the death in Trusty's cattle arena.">
    <meta name="theme-color" content="#fbf8f0">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Trusty da Horse">
    <meta property="og:title" content="Trusty's Crazy Cattle 3D!">
    <meta property="og:description" content="Fight to the death in Trusty's cattle arena.">
    <meta property="og:image" content="https://trustydahorse.com/images/crazycattle.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/mobile-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/icon-16x16.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Permanent+Marker&display=swap">
    <link rel="stylesheet" href="/styles/stylesheet.css">
    <link rel="stylesheet" href="/styles/games.css">
    <script type="module" src="/scripts/site.js"></script>
    <script> window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); }; </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <trusty-header></trusty-header>

    <main id="main">
        <div class="container game-head">
            <a class="back-link" href="/pages/games.html">All games</a>
            <div class="game-title-row">
                <div>
                    <p class="eyebrow">Fight for your life!</p>
                    <h1>Trusty's Crazy Cattle 3D!</h1>
                </div>
                <div class="game-actions">
                    <button class="btn btn-outline btn-sm" type="button" id="focus-btn" aria-pressed="false">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
                        Full screen
                    </button>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="stage arcade-stage" id="stage">
                <iframe id="frame" title="Crazy Cattle 3D" data-src="/pages/games/embed/clcrazycattle3d.html" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
                <div class="arcade-facade" id="facade">
                    <img src="/images/crazycattle.png" alt="" decoding="async">
                    <div class="arcade-facade-inner">
                        <p>This is where Trusty battles the most ruthless foes!</p>
                        <button class="btn btn-lg btn-highlight" type="button" id="load-btn">Load game</button>
                        <p class="touch-only">Heads up: this one needs a keyboard, so it plays best on a computer.</p>
                    </div>
                </div>
                <button class="btn btn-outline btn-sm focus-close" type="button" data-focus-close hidden>&#10005; Exit</button>
            </div>
            <div class="arcade-notes">
                <span>Game files are downloaded from an external CDN, so the first load can take a moment.</span>
                <a class="text-link" href="/pages/games.html">More games</a>
            </div>
        </div>
    </main>

    <trusty-footer></trusty-footer>

    <script type="module">
        import { bindFocusMode, bringIntoView } from '/scripts/game-kit.js';

        const stage = document.getElementById('stage');
        const frame = document.getElementById('frame');
        const facade = document.getElementById('facade');
        const setFocus = bindFocusMode(stage, null);

        function load() {
            if (!frame.src) frame.src = frame.dataset.src;
            facade.hidden = true;
            bringIntoView();
            frame.focus();
        }

        document.getElementById('load-btn').addEventListener('click', load);
        document.getElementById('focus-btn').addEventListener('click', async () => {
            load();
            if (document.fullscreenEnabled && stage.requestFullscreen) {
                try { await stage.requestFullscreen(); return; } catch { /* fall back to the in-page version */ }
            }
            setFocus(true);
        });
    </script>
</body>
</html>
